name: PMHelper CI/CD

on:
  push:
    branches: [main, production, develop, feat/web-v1]
    tags:
      - "v*"
  pull_request:
    branches: [main, production, feat/web-v1]
  release:
    types: [published]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        exclude:
          # Reduce matrix size for faster builds
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.9"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-cov pytest-mock
          # Install package in editable mode (pyproject.toml carries all runtime deps)
          pip install -e .

      - name: Create test directory if not exists
        run: |
          if [ ! -d "tests" ]; then
            mkdir tests
            echo "# Placeholder test file" > tests/__init__.py
            echo "def test_placeholder(): assert True" > tests/test_placeholder.py
          fi
        shell: bash

      - name: Run tests
        run: |
          # Run tests with proper configuration
          python -m pytest tests/ --cov=src/pmhelper --cov-report=xml --cov-report=term-missing --cov-report=html
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy
          pip install -e .

      - name: Run black
        run: |
          black --check src/
          # Only check tests if directory exists
          if [ -d "tests" ]; then black --check tests/; fi

      - name: Run flake8
        run: |
          flake8 src/
        continue-on-error: true

      - name: Run mypy
        run: |
          mypy src/pmhelper/ --ignore-missing-imports
        continue-on-error: true # Don't fail CI on type issues yet

  # ── Angular Frontend ──────────────────────────────────────────────────────

  angular-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng lint

  angular-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration=production

  angular-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  angular-e2e:
    needs: [angular-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration=production
      - name: Start server and run Cypress
        run: |
          npx http-server dist/pmhelper-edu-web/browser -p 4200 -s &
          npx wait-on http://localhost:4200 --timeout 30000
          npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:4200

  build-package:
    needs: [test, lint, angular-lint, angular-build, angular-test, angular-e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  build-executable:
    needs: [test]
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cx_Freeze
          pip install -e .

      - name: Build executable
        run: |
          python packaging/build_setup.py build

      - name: Create distribution archive
        run: |
          7z a PMHelper-windows.zip build/exe.win-amd64-3.12/*

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: PMHelper-windows.zip

  publish-pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test, lint, build-package]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pmhelper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

  publish-github-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build-executable]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-executable

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: PMHelper-windows.zip
          name: PMHelper-${{ github.event.release.tag_name }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-render:
    if: github.ref == 'refs/heads/production'
    needs: [angular-build, angular-test, angular-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
