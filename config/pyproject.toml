[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmhelper"
version = "1.0.0"
description = "A comprehensive toolkit for Critical Path Method (CPM) and PERT analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PMHelper Team"},
]
keywords = ["project management", "cpm", "pert", "critical path", "scheduling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "networkx>=2.6",
    "matplotlib>=3.4.0",
    "tabulate>=0.8.9",
    "openpyxl>=3.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pyinstaller>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/seifouda/PMhelper"
Repository = "https://github.com/seifouda/PMhelper"
Documentation = "https://github.com/seifouda/PMhelper/blob/main/README.md"

[project.scripts]
pmhelper = "pmhelper.cli.cpm_cli:main"
pmhelper-cpm = "pmhelper.cli.cpm_cli:main"
pmhelper-pert = "pmhelper.cli.pert_cli:main"

[project.gui-scripts]
pmhelper-gui = "pmhelper.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pmhelper"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
