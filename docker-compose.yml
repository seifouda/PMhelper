version: "3.8"

services:
  pmhelper:
    build: .
    container_name: pmhelper-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/pmhelper.db
      - DEBUG=true
      - ENVIRONMENT=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
