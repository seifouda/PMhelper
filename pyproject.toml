[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmhelper"
version = "1.0.0"
description = "A comprehensive project management analysis tool implementing CPM, PERT, and advanced scheduling optimization algorithms."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "PMHelper Team", email = "contact@pmhelper.org"}
]
maintainers = [
    {name = "PMHelper Team", email = "contact@pmhelper.org"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop", 
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["project management", "cpm", "pert", "critical path", "scheduling", "gantt", "network analysis"]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
    "tabulate>=0.8.9",
    "openpyxl>=3.0.7",
    "tksheet>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0", 
    "flake8>=3.9.0",
    "mypy>=0.910",
]
test = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-mock>=3.6.0",
]
full = [
    "plotly>=5.0.0",
]

[project.urls]
"Homepage" = "https://github.com/seifouda/PMhelper"
"Bug Reports" = "https://github.com/seifouda/PMhelper/issues"
"Source" = "https://github.com/seifouda/PMhelper"
"Documentation" = "https://github.com/seifouda/PMhelper/blob/main/README.md"

[project.scripts]
pmhelper = "pmhelper.cli.cpm_cli:main"
pmhelper-cpm = "pmhelper.cli.cpm_cli:main"  
pmhelper-pert = "pmhelper.cli.pert_cli:main"

[project.gui-scripts]
pmhelper-gui = "pmhelper.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmhelper = [
    "assets/*.csv",
    "assets/*.xlsx", 
    "config/*.ini",
]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | __pycache__
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=src/pmhelper",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".venv",
]